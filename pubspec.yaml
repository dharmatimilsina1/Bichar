

name: bichar
description: Bichar - Share your thoughts
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.2.1
  cloud_firestore: ^6.0.3
  firebase_auth: ^6.1.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo (1).jpg
  
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo (1).jpg"
  min_sdk_android: 21
