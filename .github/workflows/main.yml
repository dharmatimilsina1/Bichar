

name: Bichar Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Backup Bichar Code
        run: cp lib/main.dart /tmp/bichar_main.dart

      - name: Create Android Project
        run: flutter create . --platforms=android --project-name bichar

      - name: Verify Firebase Config
        run: test -f android/app/google-services.json

      - name: Configure Firebase
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          content = settings.read_text()

          plugin = '    id("com.google.gms.google-services") version "4.4.2" apply false'

          if "com.google.gms.google-services" not in content:
              content = content.replace(
                  "plugins {",
                  "plugins {\n" + plugin,
                  1
              )
              settings.write_text(content)

          app = Path("android/app/build.gradle.kts")
          content = app.read_text()

          app_plugin = '    id("com.google.gms.google-services")'

          if "com.google.gms.google-services" not in content:
              content = content.replace(
                  "plugins {",
                  "plugins {\n" + app_plugin,
                  1
              )
              app.write_text(content)
          PY

      - name: Show Android Package Name
        run: grep applicationId android/app/build.gradle.kts

      - name: Set Android App Name
        run: sed -i 's/android:label="[^"]*"/android:label="Bichar"/' android/app/src/main/AndroidManifest.xml

      - name: Restore Bichar Code
        run: cp /tmp/bichar_main.dart lib/main.dart

      - name: Verify Bichar Code
        run: grep -q "Bichar Community" lib/main.dart

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bichar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
